<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15121C">
<meta name="description" content="Collage, writing and data by Wafa Alhayek. Untitled works, in the order they happened.">
<meta property="og:title" content="Wafa Alhayek">
<meta property="og:description" content="Collage, writing and data: different ways of looking closely.">
<meta property="og:image" content="/img/works/IMG_1175-1600.webp">
<title>Wafa Alhayek</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#15121C;--paper:#E6E2D6;--accent:#D6177A;
  --ink:#15121C;--muted:rgba(230,226,214,.62);--line:rgba(230,226,214,.18);
  --ink-muted:rgba(21,18,28,.62);--ink-line:rgba(21,18,28,.18);
  --disp:'Bodoni Moda',Didot,Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --hand:'Caveat','Bradley Hand','Segoe Print',cursive;
  --gutter:clamp(16px,3vw,40px);--gap:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--ground);color:var(--paper);font:13px/1.6 var(--mono);overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.09;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--paper)}
img{max-width:100%;height:auto}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.link{display:inline-flex;gap:10px;align-items:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer}
.link:hover{color:var(--paper)}
.on-paper .link:hover{color:var(--ink)}
.disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:-.01em;line-height:.98;margin:0;text-wrap:balance}
.hand{font-family:var(--hand);font-weight:500}

/* ---------- header ---------- */
.site-header{display:flex;align-items:center;gap:clamp(16px,3vw,40px);padding:18px var(--gutter);flex-wrap:wrap}
.wordmark{font:400 21px/1 var(--disp);text-transform:uppercase;text-decoration:none;letter-spacing:.02em;white-space:nowrap}
.nav{display:flex;gap:clamp(14px,2vw,28px);flex-wrap:wrap}
.nav a{font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--accent)}
.roles{margin-left:auto;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px}
.roles::after{content:"";width:28px;height:1px;background:var(--muted)}

/* ---------- hero ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.35fr) minmax(0,.32fr);gap:clamp(18px,3vw,44px);padding:clamp(16px,3vw,36px) var(--gutter) clamp(30px,4vw,56px);align-items:start}
.hero-copy{display:flex;flex-direction:column;gap:22px;min-width:0;padding-top:clamp(10px,2vw,30px);min-height:100%}
.hero h1{font-size:clamp(30px,3.3vw,52px)}
.hero-copy > .link{align-self:flex-start}
.hero-intro{max-width:44ch;color:var(--muted);font-size:12px;line-height:1.8;margin:0}
.exhibit{margin-top:auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding-top:28px}
.exhibit-art{position:relative;width:clamp(70px,8vw,104px);aspect-ratio:3/4}
.exhibit-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:rotate(-4deg)}
.exhibit-art::after{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--accent);left:-22%;bottom:-14%;z-index:-1}
.exhibit h3{font:400 15px/1.3 var(--disp);margin:6px 0 4px;text-wrap:balance}
.exhibit .meta{font-size:10px;letter-spacing:.06em;color:var(--muted);line-height:1.7}
.exhibit .link{margin-top:10px}

.stage{position:relative;min-width:0}
.feature{position:relative;display:flex;justify-content:center;width:100%;border:0;padding:0;background:none;cursor:pointer}
.feature img{display:block;width:auto;max-width:100%;max-height:min(80vh,720px)}
.hero-note{position:absolute;right:calc(-1 * clamp(10px,2vw,30px));bottom:-24px;font-size:clamp(20px,2vw,28px);line-height:.95;color:var(--paper);transform:rotate(-10deg);z-index:4;text-align:left;pointer-events:none}
.hero-note span{display:block}.hero-note span:nth-child(2){padding-left:.8em}.hero-note span:nth-child(3){padding-left:1.6em}

.mini{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:clamp(10px,2vw,30px)}
.mini-thumbs{display:flex;flex-direction:column;gap:10px}
.mini-thumbs button{border:0;padding:0;background:none;cursor:pointer;display:block;width:100%;max-width:96px}
.mini-thumbs img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;filter:saturate(.95)}
.mini-thumbs button:hover img{outline:1px solid var(--accent);outline-offset:3px}
.mini .label{color:var(--muted);line-height:1.8}
.mini .link{color:var(--paper);align-self:flex-start}

/* ---------- decoration layers on a work ---------- */
.deco-wrap{position:relative;display:inline-block;line-height:0;max-width:100%}
.deco-wrap .grain,.deco-wrap .halftone{position:absolute;inset:0;pointer-events:none}
.deco-wrap .grain{mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .25 0 0 0 .55 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E")}
.deco-wrap .halftone{mix-blend-mode:multiply;opacity:.35;background:radial-gradient(rgba(21,18,28,.9) .9px,transparent 1.3px) 0 0/5px 5px}
.tape{position:absolute;z-index:3;top:10px;right:12px;background:url(img/deco/tape.webp) center/100% 100% no-repeat;color:var(--ink);font-size:9px;letter-spacing:.1em;padding:6px 12px;transform:rotate(3deg);white-space:nowrap;pointer-events:none}
.scribble{position:absolute;z-index:3;pointer-events:none;overflow:visible}
.scribble path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}

/* ---------- archive ---------- */
.on-paper{background:var(--paper);color:var(--ink)}
.archive{display:grid;grid-template-columns:minmax(220px,.32fr) minmax(0,1fr) 34px;gap:clamp(20px,3vw,44px);padding:clamp(30px,4vw,56px) var(--gutter)}
.archive-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.archive h2{font-size:clamp(30px,3.4vw,48px)}
.rule{width:28px;height:1px;background:currentColor;opacity:.5}
.archive-intro{font-size:10px;letter-spacing:.08em;text-transform:uppercase;line-height:1.9;color:var(--ink-muted);margin:0;max-width:36ch}
.filters{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.filters button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink-muted);letter-spacing:inherit;text-transform:inherit}
.filters button[aria-pressed=true]{color:var(--accent)}
.filters span{opacity:.4}
.archive-count{font-size:10px;letter-spacing:.08em;color:var(--ink-muted)}
.board-wrap{min-width:0}
#board{position:relative;width:100%;transition:height .35s ease}
.piece{position:absolute;margin:0}
.work{border:0;padding:0;background:none;cursor:pointer;display:block}
.work .frame{position:absolute;inset:0;overflow:visible}
.work img{display:block;width:100%;height:100%;object-fit:cover;background:rgba(21,18,28,.08)}
.work:hover img{filter:brightness(1.05)}
.work:hover .frame{outline:1px solid var(--accent);outline-offset:3px}
.work .cap{position:absolute;left:0;bottom:-19px;font-size:9px;letter-spacing:.1em;color:var(--ink-muted);white-space:nowrap}
.work .tape{top:-8px;right:auto;left:10px;transform:rotate(-3deg);font-size:8px;padding:4px 9px}
.tile{display:grid;place-items:center;text-align:center;overflow:hidden;pointer-events:none}
.tile-dot{background:radial-gradient(circle,var(--accent) 0 30%,transparent 30.5%),radial-gradient(rgba(214,23,122,.45) 1px,transparent 1.4px) 0 0/7px 7px}
.tile-count{border:1px solid var(--ink-line);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);line-height:1.8;padding:8px}
.tile-count b{display:block;font:400 clamp(28px,3vw,46px)/1 var(--disp);color:var(--ink);letter-spacing:-.02em}
.tile-note{font-size:clamp(18px,1.8vw,26px);line-height:1;color:var(--accent);transform:rotate(-6deg)}
.tile-note span{display:block}.tile-note span:nth-child(2){padding-left:.8em}.tile-note span:nth-child(3){padding-left:1.6em}
.tile-scrap{background:center/contain no-repeat}
.rail{display:flex;flex-direction:column;align-items:center;gap:14px;border-left:1px solid var(--ink-line);padding-left:10px;font-size:10px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.rail button{background:none;border:0;cursor:pointer;color:var(--ink-muted);padding:2px 4px}
.rail button[aria-current=true]{color:var(--accent)}
.rail button:disabled{opacity:.25;cursor:default}
.rail .arrow{font-size:14px;color:var(--accent)}
.pager-mobile{display:none}

/* ---------- split rows ---------- */
.split{display:grid;grid-template-columns:1fr 1fr}
.split > section{min-width:0;padding:clamp(30px,4vw,56px) var(--gutter);position:relative;overflow:hidden}
.split h2{font-size:clamp(26px,3vw,42px)}

/* game */
.game{display:flex;flex-direction:column;gap:18px}
.game-intro{color:var(--muted);font-size:11px;margin:0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;perspective:1200px}
.card{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg);cursor:default}
.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);overflow:hidden}
.card .back canvas{display:block;width:100%;height:100%}
.card .back::after{content:"?";position:absolute;inset:auto 0 10px 0;text-align:center;font:400 22px var(--disp);color:var(--paper);opacity:.7}
.card .front{transform:rotateY(180deg);background:var(--ground)}
.card .front img{width:100%;height:100%;object-fit:contain;display:block}
.card.dim{opacity:.35;transition:opacity .6s}
.card:not(.flipped):hover{transform:translateY(-4px)}
.oracle{min-height:3.6em;font:400 clamp(17px,1.8vw,22px)/1.35 var(--disp);font-style:italic;margin:0;color:var(--paper);text-wrap:balance}
.oracle .label{display:block;font-style:normal;font-family:var(--mono);color:var(--accent);margin-bottom:6px}
.game-actions{display:flex;gap:22px;flex-wrap:wrap}

/* writing */
.writing{padding-right:clamp(120px,22%,240px)!important}
.entries{list-style:none;margin:24px 0 18px;padding:0;max-width:560px}
.entry{border-bottom:1px solid var(--ink-line)}
.entry button{display:grid;grid-template-columns:1fr auto;gap:4px 16px;width:100%;text-align:left;background:none;border:0;padding:14px 0;cursor:pointer;color:inherit}
.entry .date{grid-column:1/-1;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.entry .title{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.entry .arrow{color:var(--ink);transition:transform .2s}
.entry button:hover .title{color:var(--accent)}
.entry button[aria-expanded=true] .arrow{transform:rotate(90deg)}
.entry .body{display:none;padding:0 0 16px;font:15px/1.75 var(--disp);max-width:52ch}
.entry .body p{margin:0 0 10px}
.entry.open .body{display:block}
.sample{display:inline-block;margin-left:8px;font-size:8px;letter-spacing:.1em;color:var(--accent);border:1px solid currentColor;padding:0 5px;vertical-align:2px}
.side-deco{position:absolute;top:-10px;bottom:-10px;right:-6px;width:clamp(110px,20%,220px);pointer-events:none}
.side-deco img{position:absolute;width:100%;height:auto;object-fit:contain}
.side-deco img:nth-child(1){top:0;transform:rotate(2deg)}
.side-deco img:nth-child(2){top:34%;right:18%;width:70%;transform:rotate(-5deg)}

/* data */
.projects{list-style:none;padding:0;margin:22px 0 18px;display:flex;flex-direction:column}
.project{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;border-bottom:1px solid var(--ink-line);padding:14px 0}
.project canvas,.project img{width:72px;height:56px;display:block;object-fit:cover;border:1px solid var(--ink-line)}
.project h3{margin:0 0 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.project p{margin:0;font-size:10px;line-height:1.7;color:var(--ink-muted)}
.project .go{color:var(--ink);text-decoration:none;font-size:14px}
.project .go:hover{color:var(--accent)}
.project .status{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}

/* about */
.about{padding-right:clamp(140px,34%,320px)!important}
.about-body{color:var(--muted);font:14px/1.75 var(--disp);max-width:42ch;margin:18px 0}
.about-body p{margin:0 0 12px}
.contact{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.contact .row{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.contact .row a{text-decoration:none;color:var(--paper)}
.contact .row a:hover{color:var(--accent)}
.contact .row span{opacity:.4}
.about-art{position:absolute;right:var(--gutter);top:50%;transform:translateY(-50%);width:clamp(120px,28%,280px);pointer-events:none}
.about-art .deco-wrap{transform:rotate(2deg)}
.about-art .halo{position:absolute;width:55%;aspect-ratio:1;border-radius:50%;background:var(--accent);top:-8%;right:-8%;z-index:-1}
.about-art .strip{position:absolute;left:-18%;bottom:12%;width:42%;transform:rotate(-8deg);z-index:2}

/* footer */
.site-footer{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:20px var(--gutter) 28px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.site-footer .grow{flex:1}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:100;background:rgba(15,12,20,.96);display:grid;place-items:center;padding:clamp(12px,3vw,40px)}
.viewer[hidden]{display:none}
.viewer-panel{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,.7fr);gap:clamp(18px,3vw,44px);width:min(1180px,100%);max-height:100%;border:1px solid var(--line);padding:clamp(16px,2.5vw,32px)}
.viewer-art{position:relative;display:grid;place-items:center;min-height:0}

.viewer-art img{display:block;max-width:100%;max-height:calc(100vh - 160px);width:auto;height:auto}
.viewer-info{display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
.viewer-info h2{font:500 15px/1.2 var(--mono);letter-spacing:.06em;margin:0}
.viewer-info dl{margin:0;display:grid;gap:3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.viewer-info dd{margin:0}
.viewer-info .desc{font-size:11px;line-height:1.85;color:var(--paper);max-width:40ch;margin:4px 0 0}
.viewer-info .actions{display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:auto;padding-top:16px}
.viewer-nav{display:flex;align-items:center;gap:18px;font-size:10px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
.viewer-nav button{background:none;border:0;cursor:pointer;color:var(--paper);font-size:16px;padding:4px}
.viewer-nav button:hover{color:var(--accent)}
.viewer-close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--paper);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:6px}
.viewer-close:hover{color:var(--accent)}

.load-error{padding:40px var(--gutter);color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
  .mini{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center;padding-top:0}
  .mini-thumbs{flex-direction:row}
  .mini-thumbs button{width:72px}
  .archive{grid-template-columns:minmax(0,1fr)}
  .archive-copy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end}
  .rail{display:none}
  .pager-mobile{display:flex;gap:16px;align-items:center;justify-content:flex-end;margin-top:30px;font-size:10px;letter-spacing:.1em;color:var(--ink-muted);font-variant-numeric:tabular-nums}
  .pager-mobile button{background:none;border:1px solid var(--ink-line);padding:6px 12px;cursor:pointer;color:var(--ink)}
  .pager-mobile button:disabled{opacity:.3}
  .split{grid-template-columns:1fr}
  .split-b{display:flex;flex-direction:column-reverse}
}
@media (max-width:700px){
  .roles{display:none}
  .nav{width:100%}
  .hero{grid-template-columns:1fr}
  .stage{order:-1}
  .hero-note{right:4px;bottom:-30px}
  .archive-copy{display:flex}
  .writing,.about{padding-right:var(--gutter)!important}
  .side-deco{display:none}
  .about-art{position:relative;right:auto;top:auto;transform:none;width:60%;margin:30px 0 10px auto}
  .cards{gap:8px}
  .viewer-panel{grid-template-columns:1fr;overflow:auto}
  .viewer-art img{max-height:56vh}
  :root{--gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="#top" id="wordmark">Wafa Alhayek</a>
  <nav class="nav" aria-label="Sections">
    <a href="#archive">Archive</a><a href="#writing">Writing</a><a href="#data">Data</a><a href="#about">About</a><a href="#play">Play</a>
  </nav>
  <span class="roles" id="roles"></span>
</header>

<main id="top">
  <section class="hero" aria-labelledby="heroTitle">
    <div class="hero-copy">
      <div class="eyebrow" id="heroEyebrow"></div>
      <h1 class="disp" id="heroTitle"></h1>
      <p class="hero-intro" id="heroIntro"></p>
      <a class="link" href="#archive">Explore the archive <span aria-hidden="true">→</span></a>
      <div class="exhibit" id="exhibit" hidden>
        <div class="exhibit-art" aria-hidden="true"><img id="exhibitArt" alt=""></div>
        <div>
          <div class="label" id="exLabel" style="color:var(--muted)"></div>
          <h3 id="exTitle"></h3>
          <div class="meta" id="exMeta"></div>
          <a class="link" id="exLink" target="_blank" rel="noopener" hidden>Learn more <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </div>
    <div class="stage">
      <button class="feature" id="feature" type="button"></button>
      <div class="hero-note hand" id="heroNote" aria-hidden="true"></div>
    </div>
    <aside class="mini" aria-label="More works">
      <div class="mini-thumbs" id="miniThumbs"></div>
      <div class="label" id="miniMeta"></div>
      <button class="link" id="miniOpen" type="button">View work <span aria-hidden="true">→</span></button>
    </aside>
  </section>

  <section class="archive on-paper" id="archive" aria-labelledby="archiveTitle">
    <div class="archive-copy">
      <div>
        <div class="eyebrow">The archive</div>
        <h2 class="disp" id="archiveTitle" style="margin-top:12px"></h2>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="rule"></div>
        <p class="archive-intro" id="archiveIntro"></p>
        <div class="filters" role="group" aria-label="Filter works">
          <button data-filter="all" aria-pressed="true">All</button><span>/</span>
          <button data-filter="collage" aria-pressed="false">Collage</button><span>/</span>
          <button data-filter="drawing" aria-pressed="false">Drawing</button>
        </div>
        <div class="archive-count" id="archiveCount"></div>
      </div>
    </div>
    <div class="board-wrap">
      <div id="board" aria-live="polite"></div>

<footer class="site-footer"><span id="footName"></span><span class="grow"></span><span>Collage · Writing · Data</span></footer>

        <div class="viewer-nav"><button id="vPrev" aria-label="Previous work">←</button><span id="vPos"></span><button id="vNext" aria-label="Next work">→</button></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   Content lives in /content/*.json and is edited through Pages CMS
   (.pages.yml). Nothing here needs touching to add works or writing.
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
let SITE,WORKS=[],ALL=[],WRITING=[],DATA=[];

function rng(seed){return()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296)}
function num(ref){return parseInt(String(ref).replace(/\D/g,""),10)||0}
function src(w,size){return w.width?`img/works/${w.ref}-${size}.webp`:(w.image||"").replace(/^\//,"")}
function ar(w){return w.width&&w.height?w.width/w.height:1}
function paras(t){return String(t||"").split(/\n\s*\n/).map(p=>`<p>${esc(p.trim())}</p>`).join("")}

/* ---------- decorations drawn on top of a work ---------- */
function tearPath(seed,side){
  const r=rng(seed),pts=[],n=26,jag=()=>(r()*2.6).toFixed(2);
  const L=side==="left"||side==="both",R=side==="right"||side==="both";
  pts.push(L?`${jag()}% 0%`:"0% 0%");
  pts.push(R?`${(100-+jag()).toFixed(2)}% 0%`:"100% 0%");
  if(R)for(let i=1;i<n;i++)pts.push(`${(100-r()*3.2).toFixed(2)}% ${(i*100/n).toFixed(2)}%`);
  pts.push(R?`${(100-+jag()).toFixed(2)}% 100%`:"100% 100%");
  pts.push(L?`${jag()}% 100%`:"0% 100%");
  if(L)for(let i=n-1;i>0;i--)pts.push(`${(r()*3.2).toFixed(2)}% ${(i*100/n).toFixed(2)}%`);
  return `polygon(${pts.join(",")})`;
}
const SCRIBBLES={
  loop:{box:"right:-6%;top:38%;width:44%;height:34%",d:"M6 44 C20 6, 58 0, 70 18 S44 60, 28 48 S56 8, 94 20 S78 58, 58 52"},
  zigzag:{box:"left:6%;bottom:8%;width:46%;height:16%",d:"M2 30 L14 6 L26 30 L38 6 L50 30 L62 6 L74 30 L86 6 L98 30"},
  circle:{box:"left:18%;top:12%;width:56%;height:40%",d:"M50 6 C78 4, 98 22, 94 42 C90 60, 62 66, 40 62 C14 58, 2 40, 8 24 C14 10, 34 4, 56 8"},
  underline:{box:"left:8%;bottom:4%;width:70%;height:10%",d:"M2 20 C30 12, 60 26, 98 10 M10 30 C40 22, 70 34, 92 24"}
};
function decorate(w,img,{tape=true}={}){
  const wrap=document.createElement("span");wrap.className="deco-wrap";
  if(w.torn&&w.torn!=="none")img.style.clipPath=tearPath(num(w.ref),w.torn);
  wrap.append(img);
  if(w.texture==="grain"||w.texture==="halftone"){const t=document.createElement("span");t.className=w.texture;if(img.style.clipPath)t.style.clipPath=img.style.clipPath;wrap.append(t)}
  const s=SCRIBBLES[w.scribble];
  if(s)wrap.insertAdjacentHTML("beforeend",`<svg class="scribble" style="${s.box}" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="${s.d}"/></svg>`);
  if(tape&&w.tape)wrap.insertAdjacentHTML("beforeend",`<span class="tape" aria-hidden="true">${esc(w.ref)}</span>`);
  return wrap;
}
function workImg(w,size,cls){
  const img=new Image();img.src=src(w,size);img.alt=w.alt||`Untitled ${w.set||"work"}, ${w.ref}`;img.decoding="async";
  if(w.width){img.width=w.width;img.height=w.height}
  if(cls)img.className=cls;return img;
}

/* ---------- hero ---------- */
function renderHero(){
  const h=SITE.hero||{},ex=SITE.exhibition||{};
  $("#heroEyebrow").textContent=h.eyebrow||"";
  $("#heroTitle").textContent=h.headline||"";
  $("#heroIntro").textContent=h.intro||"";
  $("#heroNote").innerHTML=(h.note||"").split("/").map(s=>`<span>${esc(s.trim())}</span>`).join("");
  if(ex.show!==false&&ex.title){
    $("#exhibit").hidden=false;
    $("#exLabel").textContent=ex.label||"";$("#exTitle").textContent=ex.title;
    $("#exMeta").innerHTML=[ex.dates,ex.venue,ex.detail].filter(Boolean).map(esc).join("<br>");
    if(ex.link){$("#exLink").href=ex.link;$("#exLink").hidden=false}
    if(h.sideDecoration)$("#exhibitArt").src=h.sideDecoration.replace(/^\//,"");
  }
  const feat=ALL.find(w=>w.featured)||ALL[ALL.length-1];
  if(!feat)return;
  const f=$("#feature");f.innerHTML="";f.append(decorate(feat,workImg(feat,"1600")));
  f.setAttribute("aria-label",`Open featured work ${feat.ref}`);
  f.onclick=()=>openViewer(feat,ALL);
  const others=ALL.filter(w=>w!==feat).slice(-3).reverse();
  const mt=$("#miniThumbs");mt.innerHTML="";
  others.forEach(w=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Open "+w.ref);b.append(workImg(w,"640"));b.onclick=()=>openViewer(w,ALL);mt.append(b)});
  $("#miniMeta").innerHTML=`${esc(feat.ref)}<br>${esc(feat.set||"")}${feat.medium?"<br>— "+esc(feat.medium):""}`;
  $("#miniOpen").onclick=()=>openViewer(feat,ALL);
}

/* ---------- archive puzzle ----------
   Works keep their true proportions. Each row is scaled so its pieces exactly
   fill the width. When the next work would squash a row (or a row is left
   short at the end of a page), a balance tile is slotted in instead. */
let filter="all",page=0,PAGES=[];
const TILES=["dot","count","note","scrap"];
function tile(kind,a){return{tile:true,kind,ar:a}}
function buildRows(list,W,T,gap){
  const rows=[];let row=[],sum=0,t=0;
  const nextTile=a=>tile(TILES[t++%TILES.length],a);
  const want=r=>T*(r.some(i=>i.w&&i.w.big)?1.45:1);
  for(const it of list){
    row.push(it);sum+=it.ar;
    const target=want(row);
    if(sum*target+gap*(row.length-1)>=W){
      const h=(W-gap*(row.length-1))/sum;
      if(h<target*.74&&row.length>1){
        const last=row.pop();sum-=last.ar;
        const need=(W-gap*row.length)/want(row)-sum;
        if(need>=.4)row.push(nextTile(Math.min(need,1.8)));
        rows.push(row);row=[last];sum=last.ar;
      }else{rows.push(row);row=[];sum=0}
    }
  }
  if(row.length){
    const need=(W-gap*row.length)/T-sum;
    if(need>=.4){row.push(nextTile(Math.min(need,2.2)));if(need>2.6)row.push(nextTile(need-2.2-gap/T))}
    rows.push(row);
  }
  return rows;
}
function pieceEl(it,i){
  if(it.tile){
    const d=document.createElement("div");d.className="piece tile tile-"+it.kind;d.setAttribute("aria-hidden","true");
    if(it.kind==="count")d.innerHTML=`<div><b>${ALL.length}</b>works,<br>untitled,<br>in sequence</div>`;
    if(it.kind==="note")d.innerHTML=`<div class="hand">${(SITE.archive?.balanceNote||"").split("/").map(s=>`<span>${esc(s.trim())}</span>`).join("")}</div>`;
    if(it.kind==="scrap"){const dec=DECOS.filter(x=>x.kind==="scrap");const pick=dec[i%Math.max(1,dec.length)];if(pick)d.style.backgroundImage=`url(${pick.image.replace(/^\//,"")})`;else d.className="piece tile tile-dot"}
    return d;
  }
  const w=it.w,b=document.createElement("button");
  b.type="button";b.className="piece work";b.setAttribute("aria-label",`Open untitled work ${w.ref}`);
  const fr=document.createElement("span");fr.className="frame";
  const img=workImg(w,"640");img.loading="lazy";
  const wrap=decorate(w,img);wrap.style.cssText="position:absolute;inset:0";
  fr.append(wrap);b.append(fr);
  b.insertAdjacentHTML("beforeend",`<span class="cap">${esc(w.ref)}</span>`);
  b.onclick=()=>openViewer(w,WORKS);
  return b;
}
function layoutArchive(){
  const board=$("#board"),W=board.clientWidth;if(!W)return;
  const gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap"))||12;
  const capGap=gap+22; /* room for the ref caption under each row */
  const T=W<520?W*.42:W<900?W*.3:W*.26;
  const list=WORKS.map(w=>({w,ar:ar(w)}));
  const rows=buildRows(list,W,T,gap);
  const per=Math.max(1,(W<520?(SITE.archive?.rowsPerPage||2)+1:SITE.archive?.rowsPerPage||2));
  PAGES=[];for(let i=0;i<rows.length;i+=per)PAGES.push(rows.slice(i,i+per));
  page=Math.min(page,Math.max(0,PAGES.length-1));
  board.innerHTML="";let y=0,k=0;
  (PAGES[page]||[]).forEach(row=>{
    const sum=row.reduce((a,i)=>a+i.ar,0);
    let h=(W-gap*(row.length-1))/sum;
    const isLast=row===rows[rows.length-1];
    if(isLast&&h>T*1.5)h=T;
    let x=0;
    row.forEach(it=>{const el=pieceEl(it,k++);const w=it.ar*h;Object.assign(el.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});board.append(el);x+=w+gap});
    y+=h+capGap;
  });
  board.style.height=Math.max(0,y-capGap+20)+"px";
  renderPager();
  $("#archiveCount").textContent=`${WORKS.length} ${WORKS.length===1?"work":"works"} · page ${page+1} of ${Math.max(1,PAGES.length)}`;
}
function renderPager(){
  const n=PAGES.length,rail=$("#rail");
  rail.innerHTML="";
  const up=document.createElement("button");up.className="arrow";up.textContent="↑";up.setAttribute("aria-label","Previous page");up.disabled=page===0;up.onclick=()=>go(page-1);rail.append(up);
  for(let i=0;i<n;i++){const b=document.createElement("button");b.textContent=String(i+1).padStart(2,"0");b.setAttribute("aria-current",i===page);b.setAttribute("aria-label","Page "+(i+1));b.onclick=()=>go(i);rail.append(b)}
  const dn=document.createElement("button");dn.className="arrow";dn.textContent="↓";dn.setAttribute("aria-label","Next page");dn.disabled=page>=n-1;dn.onclick=()=>go(page+1);rail.append(dn);
  $("#pmLabel").textContent=`${String(page+1).padStart(2,"0")} / ${String(Math.max(1,n)).padStart(2,"0")}`;
  $("#pmPrev").disabled=page===0;$("#pmNext").disabled=page>=n-1;
}
function go(p){page=Math.max(0,Math.min(PAGES.length-1,p));layoutArchive();if(innerWidth<1000)$("#archive").scrollIntoView({behavior:reduceMotion?"auto":"smooth"})}
$("#pmPrev").onclick=()=>go(page-1);$("#pmNext").onclick=()=>go(page+1);
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
  filter=b.dataset.filter;page=0;
  document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  WORKS=ALL.filter(w=>filter==="all"||w.set===filter);layoutArchive();
});

/* ---------- viewer ---------- */
let vList=[],vIdx=0,vBack=null;
function openViewer(w,list){
  vList=list;vIdx=Math.max(0,list.indexOf(w));
  if($("#viewer").hidden)vBack=document.activeElement;
  showViewer();$("#viewer").hidden=false;document.body.style.overflow="hidden";$("#vClose").focus();
}
function showViewer(){
  const w=vList[vIdx];
  const art=$("#vArt");art.innerHTML="";art.append(decorate(w,workImg(w,"1600"),{tape:false}));
  $("#vRef").textContent=w.ref;
  $("#vMeta").innerHTML=[w.set,w.year,w.size,w.medium].filter(Boolean).map(v=>`<dd>${esc(v)}</dd>`).join("");
  $("#vDesc").textContent=w.description||"";$("#vDesc").hidden=!w.description;
  const email=SITE.contact?.email;
  if(email){$("#vInquire").href=`mailto:${email}?subject=${encodeURIComponent("Inquiry: "+w.ref)}`;$("#vInquire").hidden=false}else $("#vInquire").hidden=true;
  $("#vPos").textContent=`${vIdx+1} / ${vList.length}`;
}
function closeViewer(){$("#viewer").hidden=true;document.body.style.overflow="";vBack?.focus?.()}
function stepViewer(d){vIdx=(vIdx+d+vList.length)%vList.length;showViewer()}
$("#vClose").onclick=closeViewer;
$("#vBack").onclick=()=>{closeViewer();$("#archive").scrollIntoView({behavior:reduceMotion?"auto":"smooth"})};
$("#vPrev").onclick=()=>stepViewer(-1);$("#vNext").onclick=()=>stepViewer(1);
$("#viewer").addEventListener("click",e=>{if(e.target.id==="viewer")closeViewer()});
addEventListener("keydown",e=>{if($("#viewer").hidden)return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")stepViewer(-1);if(e.key==="ArrowRight")stepViewer(1)});

/* ---------- game: draw a plate ----------
   Each card back is the work itself, screened to two colours with the same
   8×8 Bayer matrix as dither.py, rendered at 2× and smoothed down. */
const B8=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],[3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
function hexRgb(h){h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function ditherInto(canvas,img){
  const r=canvas.getBoundingClientRect(),W=Math.max(1,Math.round(r.width)),H=Math.max(1,Math.round(r.height)),SS=2;
  const bw=W*SS,bh=H*SS,off=document.createElement("canvas");off.width=bw;off.height=bh;
  const g=off.getContext("2d",{willReadFrequently:true});
  const s=Math.max(bw/img.naturalWidth,bh/img.naturalHeight),dw=img.naturalWidth*s,dh=img.naturalHeight*s;
  g.drawImage(img,(bw-dw)/2,(bh-dh)/2,dw,dh);
  let d;try{d=g.getImageData(0,0,bw,bh)}catch(e){return}
  const px=d.data,ink=hexRgb(getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#D6177A"),gnd=[21,18,28];
  let lo=255,hi=0;for(let i=0;i<px.length;i+=16){const l=.299*px[i]+.587*px[i+1]+.114*px[i+2];if(l<lo)lo=l;if(l>hi)hi=l}
  const span=Math.max(1,hi-lo);
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){const i=(y*bw+x)*4,l=(.299*px[i]+.587*px[i+1]+.114*px[i+2]-lo)/span,c=(l*64>B8[y&7][x&7])?ink:gnd;px[i]=c[0];px[i+1]=c[1];px[i+2]=c[2];px[i+3]=255}
  g.putImageData(d,0,0);
  canvas.width=W;canvas.height=H;const cg=canvas.getContext("2d");cg.imageSmoothingEnabled=true;cg.imageSmoothingQuality="high";cg.drawImage(off,0,0,W,H);
}
let hand=[],drawn=null;
function deal(){
  const pool=[...ALL];hand=[];drawn=null;
  while(hand.length<3&&pool.length)hand.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  const box=$("#cards");box.innerHTML="";
  $("#oracle").textContent="";$("#openDrawn").hidden=true;
  hand.forEach((w,i)=>{
    const c=document.createElement("button");c.type="button";c.className="card";c.setAttribute("aria-label",`Card ${i+1}, face down`);
    c.innerHTML=`<span class="face back"><canvas></canvas></span><span class="face front"></span>`;
    box.append(c);
    const img=new Image();img.onload=()=>ditherInto(c.querySelector("canvas"),img);img.src=src(w,"640");
    c.onclick=()=>reveal(c,w);
  });
}
function reveal(card,w){
  if(drawn)return;drawn=w;
  card.querySelector(".front").append(workImg(w,"640"));
  card.classList.add("flipped");card.setAttribute("aria-label",`${w.ref}, revealed`);
  document.querySelectorAll(".card").forEach(c=>{if(c!==card)c.classList.add("dim")});
  const lines=SITE.game?.lines||[];const line=lines.length?lines[Math.floor(Math.random()*lines.length)]:"";
  setTimeout(()=>{$("#oracle").innerHTML=`<span class="label">You drew ${esc(w.ref)}</span>${esc(line)}`;$("#openDrawn").hidden=false},reduceMotion?0:650);
}
$("#redeal").onclick=deal;
$("#openDrawn").onclick=()=>drawn&&openViewer(drawn,ALL);

/* ---------- writing, data, about ---------- */
function fmtDate(d){if(!d)return"";const t=new Date(d+"T00:00:00");return isNaN(t)?d:t.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function renderWriting(){
  $("#writingTitle").textContent=SITE.writing?.headline||"Writing";
  const ul=$("#entries");ul.innerHTML="";
  WRITING.filter(e=>e.published!==false).forEach((e,i)=>{
    const li=document.createElement("li");li.className="entry";
    li.innerHTML=`<button type="button" aria-expanded="false" aria-controls="entry${i}"><span class="date">${esc(fmtDate(e.date)||e.kind||"")}${e.date&&e.kind?" · "+esc(e.kind):""}</span><span class="title">${esc(e.title)}${e.sample?'<span class="sample">sample</span>':""}</span><span class="arrow" aria-hidden="true">→</span></button><div class="body" id="entry${i}">${paras(e.body)}</div>`;
    li.querySelector("button").onclick=ev=>{const open=!li.classList.contains("open");li.classList.toggle("open",open);ev.currentTarget.setAttribute("aria-expanded",open)};
    ul.append(li);
  });
  const d=SITE.writing?.decoration,deco=$("#writingDeco");deco.innerHTML="";
  if(d){deco.insertAdjacentHTML("beforeend",`<img src="${esc(d.replace(/^\//,""))}" alt="">`);const s2=DECOS.find(x=>x.kind==="scrap"&&x.image!==d);if(s2)deco.insertAdjacentHTML("beforeend",`<img src="${esc(s2.image.replace(/^\//,""))}" alt="">`)}
}
function miniChart(canvas,kind,seed){
  const W=canvas.width=144,H=canvas.height=112,g=canvas.getContext("2d"),r=rng(seed);
  const acc=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  g.fillStyle="#E6E2D6";g.fillRect(0,0,W,H);g.strokeStyle="rgba(21,18,28,.15)";g.lineWidth=1;
  for(let x=12;x<W;x+=16){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  g.fillStyle=acc;
  if(kind==="scatter"){for(let i=0;i<34;i++){const x=10+r()*124,y=H-14-(x/144)*60-r()*28;g.beginPath();g.arc(x,y,2,0,7);g.fill()}}
  else if(kind==="steps"){g.strokeStyle=acc;g.lineWidth=2;g.beginPath();let y=H-14;g.moveTo(8,y);for(let x=8;x<W-8;x+=14){y=Math.max(14,y-r()*18+4);g.lineTo(x,y);g.lineTo(x+14,y)}g.stroke()}
  else{for(let i=0;i<14;i++){const h=12+r()*76;g.fillRect(8+i*9.4,H-8-h,6,h)}}
}
function renderData(){
  $("#dataTitle").textContent=SITE.data?.headline||"Data";
  $("#dataIntro").textContent=SITE.data?.intro||"";
  const ul=$("#projects");ul.innerHTML="";
  DATA.filter(p=>p.published!==false).forEach((p,i)=>{
    const li=document.createElement("li");li.className="project";
    const vis=p.image?`<img src="${esc(p.image.replace(/^\//,""))}" alt="">`:`<canvas aria-hidden="true"></canvas>`;
    li.innerHTML=`${vis}<div><div class="status">${esc(p.status||"")}${p.sample?" · sample":""}</div><h3>${String(i+1).padStart(2,"0")}. ${esc(p.title)}</h3><p>${esc(p.summary||"")}</p></div>${p.link?`<a class="go" href="${esc(p.link)}" target="_blank" rel="noopener" aria-label="Open ${esc(p.title)}">→</a>`:"<span></span>"}`;
    ul.append(li);
    const c=li.querySelector("canvas");if(c)miniChart(c,p.chart,40+i*17);
  });
}
function renderAbout(){
  const a=SITE.about||{},c=SITE.contact||{};
  $("#aboutTitle").textContent=a.headline||"About";
  $("#aboutBody").innerHTML=paras(a.body);
  const links=[];
  if(c.email)links.push(`<a href="mailto:${esc(c.email)}">Email</a>`);
  if(c.instagram)links.push(`<a href="${esc(c.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
  if(c.linkedin)links.push(`<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
  if(c.github)links.push(`<a href="${esc(c.github)}" target="_blank" rel="noopener">GitHub</a>`);
  $("#contactRow").innerHTML=links.length?links.join("<span>/</span>"):`<span style="opacity:.7">Contact details coming soon</span>`;
  const art=$("#aboutArt");art.innerHTML="";
  const pick=ALL.find(w=>w.aboutImage)||ALL.find(w=>!w.featured&&ar(w)<1)||ALL[0];
  if(pick){art.insertAdjacentHTML("beforeend",`<span class="halo"></span>`);art.append(decorate({...pick,tape:false,scribble:"none",torn:"right"},workImg(pick,"640")))}
  if(a.decoration)art.insertAdjacentHTML("beforeend",`<img class="strip" src="${esc(a.decoration.replace(/^\//,""))}" alt="">`);
}

/* ---------- boot ---------- */
let DECOS=[];
async function boot(){
  const get=p=>fetch(p,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(p);return r.json()});
  try{
    const [site,works,writing,data,decos]=await Promise.all([get("content/site.json"),get("content/works.json"),get("content/writing.json"),get("content/data.json"),get("content/decorations.json").catch(()=>({decorations:[]}))]);
    SITE=site;WRITING=writing.entries||[];DATA=data.projects||[];DECOS=decos.decorations||[];
    ALL=(works.works||[]).filter(w=>w.ref&&(w.image||w.width)&&w.published!==false).sort((a,b)=>num(a.ref)-num(b.ref));
    WORKS=ALL.slice();
  }catch(e){
    document.querySelector("main").insertAdjacentHTML("afterbegin",`<p class="load-error">The site content could not be loaded (${esc(e.message)}). If you opened this file directly, run <code>python3 -m http.server</code> in the folder and visit http://localhost:8000 instead.</p>`);
    return;
  }
  if(SITE.accent)document.documentElement.style.setProperty("--accent",SITE.accent);
  document.title=SITE.name||document.title;
  $("#wordmark").textContent=SITE.name||"";$("#footName").textContent=`© ${new Date().getFullYear()} ${SITE.name||""}`;
  $("#roles").textContent=SITE.roles||"";
  $("#archiveTitle").textContent=SITE.archive?.headline||"";
  $("#archiveIntro").textContent=SITE.archive?.intro||"";
  const g=SITE.game||{};
  if(g.show===false)$("#play").hidden=true;else{$("#gameTitle").textContent=g.headline||"";$("#gameIntro").textContent=g.intro||""}
  renderHero();layoutArchive();renderWriting();renderData();renderAbout();if(g.show!==false)deal();
  let t;new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(layoutArchive,80)}).observe($("#board"));
}
boot();
</script>
